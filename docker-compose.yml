services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    command: --config /etc/livekit.yaml
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50019:50000-50019/udp"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro

  tooling:
    build:
      context: .
      dockerfile: docker/Dockerfile.tooling
      target: tooling
    profiles: ["dev", "test"]
    environment:
      PYTHONPATH: /app/src:/app
    volumes:
      - .:/app
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    profiles: ["dev"]
    depends_on:
      - livekit
    network_mode: service:livekit
    command: python -m math_tutor.agent.worker start
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-devsecret-devsecret-0000
      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_FIRST_RESPONSE_SECONDS: ${LLM_FIRST_RESPONSE_SECONDS:-4}
      LLM_TOTAL_SECONDS: ${LLM_TOTAL_SECONDS:-10}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE_ID: ${TTS_VOICE_ID:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      DATABASE_PATH: /app/data/math_tutor.db
      STORE_AUDIO: "false"
    volumes:
      - .:/app

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    profiles: ["dev"]
    command: uvicorn web.app:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app
    environment:
      DATABASE_PATH: /app/data/math_tutor.db
      THERAPIST_API_ENABLED: "true"
      THERAPIST_API_TOKEN: ${THERAPIST_API_TOKEN:-}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-devsecret-devsecret-0000
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
