[project]
name = "math-tutor-voice-poc"
version = "0.1.0"
description = "Spanish primary mathematics voice tutor PoC with deterministic answer verification and therapist review"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents[deepgram,openai,elevenlabs,silero,turn-detector]>=1.2,<2",
    "livekit-api>=1.0,<2",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.34,<0.35",
    "anyio>=4.8,<4.12",
    "pyyaml>=6.0,<7",
    "openai>=2.54,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = '-q -m "not live_llm"'
markers = [
    "live_llm: tests that call a real model provider and require credentials and network access",
]
filterwarnings = ["error"]
